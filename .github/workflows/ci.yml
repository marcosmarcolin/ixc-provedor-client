name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: .githooks/gitleaks --verbose

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest: PHPStan's function signatures depend on the running PHP.
        php-version: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-file: development

      - run: composer install --no-interaction

      - run: composer lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # The default production php.ini hides deprecations, which the tests turn into failures.
          ini-file: development

      - run: composer install --no-interaction

      - run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          ini-file: development
          coverage: pcov

      - run: composer install --no-interaction

      - run: composer coverage --no-ansi 2>&1 | tee coverage.txt

      - if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            sed -n '/Summary:/,/^$/p' coverage.txt
            grep '^Line coverage' coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
